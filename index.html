<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">

  <style>
    :root {
      --accent: #c9922a;
      --accent-2: #ead19a;
      --bg: #090909;
      --surface: #151515;
      --surface-2: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.13);
      --text: #f8f8f8;
      --muted: rgba(255,255,255,.68);
      --hero-overlay: rgba(0,0,0,.70);
      --radius: 20px;
      --heading-font: 'Playfair Display', serif;
      --body-font: 'DM Sans', sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--body-font);
      overflow-x: hidden;
    }
    body.appearance-light {
      --bg: #fbfaf7;
      --surface: #ffffff;
      --surface-2: rgba(0,0,0,.04);
      --border: rgba(0,0,0,.10);
      --text: #202020;
      --muted: rgba(0,0,0,.62);
      --hero-overlay: rgba(255,255,255,.68);
    }

    .font-esthetic { font-family: var(--heading-font); }
    .text-muted-custom { color: var(--muted) !important; }
    .bg-theme { background: var(--bg); }
    .bg-surface { background: var(--surface); }
    .border-theme { border-color: var(--border) !important; }

    /* ---------- Splash ---------- */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--bg);
      transition: opacity .75s ease, transform .75s ease;
      overflow: hidden;
    }
    #splash.hide { opacity: 0; transform: scale(1.025); pointer-events: none; }
    .splash-title {
      font-family: var(--heading-font);
      color: var(--accent-2);
      font-size: clamp(2rem, 8vw, 3.5rem);
      margin-bottom: 1.4rem;
      animation: fadeDown 1s ease both;
    }
    .splash-img-wrap {
      width: min(260px, 70vw);
      height: min(260px, 70vw);
      border-radius: 50%;
      border: 4px solid var(--accent-2);
      overflow: hidden;
      box-shadow: 0 0 0 7px rgba(255,255,255,.08), 0 18px 55px rgba(0,0,0,.25);
      animation: fadeIn 1.1s .2s ease both;
    }
    .splash-img { width:100%; height:100%; object-fit:cover; display:block; }
    .splash-names {
      font-family: var(--heading-font);
      font-size: clamp(2rem, 8vw, 3.2rem);
      color: var(--text);
      margin: 1.25rem 0 2rem;
      animation: fadeUp 1s .45s ease both;
    }
    .btn-open {
      border: 0;
      background: var(--accent-2);
      color: #181818;
      border-radius: 999px;
      padding: .85rem 2rem;
      font-weight: 600;
      letter-spacing: .06em;
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      box-shadow: 0 8px 28px rgba(0,0,0,.24);
      animation: fadeUp 1s .7s ease both;
      transition: transform .2s ease, filter .2s ease;
    }
    .btn-open:hover { transform: translateY(-2px); filter: brightness(1.04); }

    .particle {
      position:absolute;
      border-radius:50%;
      background: color-mix(in srgb, var(--accent-2) 25%, transparent);
      pointer-events:none;
      animation: float linear infinite;
    }

    /* ---------- Main invitation ---------- */
    #invitation { display:none; opacity:0; transition:opacity .75s ease; }
    #invitation.show { display:block; opacity:1; }
    main { padding-bottom: 82px; }

    .hero {
      min-height: 100svh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--hero-overlay);
      z-index: -1;
    }
    .hero-bg {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:-2;
      filter: saturate(.85);
    }
    .hero-content { width:min(720px, 94vw); padding: 4.5rem 1.25rem 3.5rem; }
    .hero-title { font-family:var(--heading-font); font-size:clamp(2.1rem, 9vw, 4rem); }
    .hero-names { font-family:var(--heading-font); color:var(--accent-2); font-size:clamp(2.2rem, 9vw, 4rem); }
    .hero-date { font-size:1.15rem; }

    .section-pad { padding: 4rem 0; }
    .section-title { font-family:var(--heading-font); color:var(--accent-2); font-size:clamp(2rem,7vw,2.8rem); }

    .person-card, .event-card, .message-card, .gallery-shell {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .person-card { padding: 1.5rem; height:100%; }
    .person-photo { width:150px; height:150px; object-fit:cover; border-radius:50%; border:3px solid var(--accent-2); }
    .event-card { padding:1.25rem; text-align:center; height:100%; }
    .event-icon { color: var(--accent-2); font-size:1.2rem; }
    .map-btn, .calendar-btn, .whatsapp-btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      text-decoration:none;
      border-radius:999px;
      padding:.72rem 1.1rem;
      transition:transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .map-btn { color:var(--text); border:1px solid var(--border); }
    .calendar-btn { color:var(--text); border:1px solid var(--border); }
    .whatsapp-btn { color:#fff; background:#25d366; box-shadow:0 7px 24px rgba(37,211,102,.23); }
    .map-btn:hover, .calendar-btn:hover, .whatsapp-btn:hover { transform:translateY(-2px); }

    .count-pill {
      display:inline-block;
      padding:.55rem 1rem;
      border:1px solid var(--border);
      border-radius:999px;
      background:var(--surface-2);
    }
    #count-down h2 { font-size:2rem; color:var(--accent-2); margin:0; }

    .gallery-shell { padding:1rem; }
    .gallery-img { width:100%; max-height:420px; object-fit:cover; border-radius:16px; }
    .carousel-control-prev-icon, .carousel-control-next-icon { filter:drop-shadow(0 1px 4px rgba(0,0,0,.8)); }

    #navbar-menu {
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }
    #navbar-menu .nav-link { color:var(--muted); text-align:center; padding:.6rem .3rem; transition:color .2s ease; }
    #navbar-menu .nav-link.active, #navbar-menu .nav-link:hover { color:var(--accent-2); }
    #navbar-menu .nav-link i { display:block; font-size:1.1rem; margin-bottom:2px; }

    #music-btn, #theme-btn {
      position:fixed;
      bottom:91px;
      width:44px; height:44px;
      border-radius:50%;
      border:1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      color:var(--text);
      z-index:300;
      display:none;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      backdrop-filter:blur(12px);
      transition:transform .2s ease, border-color .2s ease;
    }
    #music-btn { left:16px; }
    #theme-btn { right:16px; }
    #music-btn.playing i { animation:spin 3s linear infinite; color:var(--accent-2); }
    #music-btn:hover, #theme-btn:hover { transform:scale(1.06); border-color:var(--accent-2); }

    .footer { color:var(--muted); }

    .wave-separator { color: var(--surface); display:block; margin-bottom:-4px; }

    @keyframes fadeDown { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:none} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }
    @keyframes fadeIn   { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }
    @keyframes float    { 0%{transform:translateY(100vh) scale(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-20vh);opacity:0} }
    @keyframes spin { to{transform:rotate(360deg)} }

    @media (max-width: 576px) {
      .section-pad { padding:3.25rem 0; }
      .hero-content { padding-top:3.5rem; }
      .person-photo { width:128px; height:128px; }
    }
  </style>

  -->

    /* ==============================================================

      "royal-gold": { accent: "#c9922a", accent2: "#ead19a", bg: "#090909", surface: "#151515" },
      "rose":       { accent: "#c76781", accent2: "#f2b6c4", bg: "#120b0e", surface: "#1d1116" },

<body>
  <div id="splash"></div>

  <button id="music-btn" type="button" aria-label="Play or pause music"><i class="fa-solid fa-music" id="music-icon"></i></button>
  <button id="theme-btn" type="button" aria-label="Toggle light and dark mode"><i class="fa-solid fa-circle-half-stroke"></i></button>

  <audio id="bg-music" loop preload="none"></audio>

  <div id="invitation">
    <nav id="navbar-menu" class="navbar fixed-bottom p-0">
      <div id="nav-items" class="navbar-nav nav-justified w-100 flex-row"></div>
    </nav>

    <main id="page-content"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <script>
    const $ = (sel, root=document) => root.querySelector(sel);
    const escapeHtml = value => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

    function applyTheme() {
      const theme = THEMES[INVITATION.theme] || THEMES["royal-gold"];
      const root = document.documentElement;
      root.style.setProperty('--accent', theme.accent);
      root.style.setProperty('--accent-2', theme.accent2);
      root.style.setProperty('--bg', theme.bg);
      root.style.setProperty('--surface', theme.surface);
      root.style.setProperty('--heading-font', INVITATION.design.headingFont);
      root.style.setProperty('--body-font', INVITATION.design.bodyFont);
      root.style.setProperty('--radius', `${Number(INVITATION.design.radius) || 20}px`);
      root.style.setProperty('--hero-overlay', INVITATION.design.heroOverlay || 'rgba(0,0,0,.70)');
      document.body.classList.toggle('appearance-light', INVITATION.appearance === 'light');
    }

    function googleCalendarUrl() {
      const d = INVITATION.date;
      const q = new URLSearchParams({
        action: 'TEMPLATE',
        text: d.calendarText,
        dates: `${toCalendarDate(d.isoStart)}/${toCalendarDate(d.isoEnd)}`,
        location: d.calendarLocation
      });
      return `https://calendar.google.com/calendar/render?${q.toString()}`;
    }

    function toCalendarDate(iso) {
      return new Date(iso).toISOString().replaceAll('-', '').replaceAll(':', '').split('.')[0] + 'Z';
    }

    function renderSplash() {
      const particles = [8,5,10,6,8,4].map((size, i) =>
        `<span class="particle" style="width:${size}px;height:${size}px;left:${10+i*15}%;animation-duration:${8+i}s;animation-delay:${i*.7}s"></span>`
      ).join('');
      $('#splash').innerHTML = `
        ${particles}
        <div class="splash-title">${escapeHtml(INVITATION.splashTitle)}</div>
        <div class="splash-img-wrap"><img class="splash-img" src="${escapeHtml(INVITATION.images.splash)}" alt="${escapeHtml(INVITATION.names)}"></div>
        <div class="splash-names">${escapeHtml(INVITATION.names)}</div>
        <button class="btn-open" id="open-invitation"><i class="fa-solid fa-envelope-open"></i>${escapeHtml(INVITATION.openingButtonText)}</button>
      `;
    }

    function renderNav() {
      const visibleNav = INVITATION.nav.filter(item => {
        if (item.id === 'people') return INVITATION.sections.people;
        if (item.id === 'schedule') return INVITATION.sections.schedule;
        if (item.id === 'gallery') return INVITATION.sections.gallery;
        if (item.id === 'wishes') return INVITATION.sections.wishes;
        return true;
      });
      $('#nav-items').innerHTML = visibleNav.map((item, i) => `
        <a class="nav-link ${i===0 ? 'active' : ''} flex-fill" href="#${escapeHtml(item.id)}">
          <i class="fa-solid ${escapeHtml(item.icon)}"></i><span style="font-size:.7rem">${escapeHtml(item.label)}</span>
        </a>
      `).join('');
    }

    function renderPeople() {
      if (!INVITATION.sections.people) return '';
      return `
        <section id="people" class="section-pad bg-theme text-center">
          <div class="container" style="max-width:900px">
            <h2 class="section-title mb-4">${INVITATION.occasion === 'wedding' ? 'Bride & Groom' : 'Meet the People'}</h2>
            <div class="row g-3 justify-content-center">
              ${INVITATION.people.map(person => `
                <div class="col-12 ${INVITATION.people.length > 1 ? 'col-md-6' : 'col-md-8'}">
                  <div class="person-card" data-aos="fade-up">
                    ${person.photo ? `<img class="person-photo mb-3" src="${escapeHtml(person.photo)}" alt="${escapeHtml(person.name)}">` : ''}
                    <div class="text-uppercase small text-muted-custom">${escapeHtml(person.role)}</div>
                    <h3 class="font-esthetic mt-1 mb-2">${escapeHtml(person.name)}</h3>
                    ${person.relation ? `<p class="mb-1 text-muted-custom">${escapeHtml(person.relation)}</p>` : ''}
                    ${person.family ? `<p class="mb-0 fw-semibold">${escapeHtml(person.family)}</p>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </section>
      `;
    }

    function renderSchedule() {
      if (!INVITATION.sections.schedule) return '';
      return `
        <section id="schedule" class="section-pad bg-surface text-center">
          <div class="container" style="max-width:980px">
            <h2 class="section-title mb-4">Event Details</h2>
            <div class="row g-3">
              ${INVITATION.events.map(event => `
                <div class="col-12 ${INVITATION.events.length > 1 ? 'col-md-6' : ''}">
                  <div class="event-card" data-aos="fade-up">
                    <h3 class="font-esthetic">${escapeHtml(event.title)}</h3>
                    <p class="fw-semibold mb-1">${escapeHtml(event.venue)}</p>
                    ${event.detail ? `<p class="mb-2 text-muted-custom"><small>${escapeHtml(event.detail)}</small></p>` : ''}
                    ${event.time ? `<p class="mb-2"><i class="fa-regular fa-clock event-icon"></i> ${escapeHtml(event.time)}</p>` : ''}
                    ${event.date ? `<p class="mb-2"><i class="fa-solid fa-calendar-days event-icon"></i> ${escapeHtml(event.date)}</p>` : ''}
                    ${event.address ? `<p class="mb-3"><i class="fa-solid fa-location-dot event-icon"></i> <small>${escapeHtml(event.address)}</small></p>` : ''}
                    ${event.mapUrl ? `<a class="map-btn" href="${escapeHtml(event.mapUrl)}" target="_blank" rel="noopener"><i class="fa-solid fa-map-location-dot"></i> View on Google Maps</a>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </section>
      `;
    }

    function renderCountdown() {
      if (!INVITATION.sections.countdown) return '';
      return `
        <section id="countdown" class="section-pad bg-theme text-center">
          <div class="container" style="max-width:760px">
            <h2 class="section-title">${escapeHtml(INVITATION.countdownTitle)}</h2>
            <p class="text-muted-custom mb-4">On ${escapeHtml(INVITATION.date.display)}</p>
            <div class="count-pill mb-4">
              <div class="row g-0" id="count-down">
                <div class="col-3 px-2"><h2 id="day">--</h2><small>Day</small></div>
                <div class="col-3 px-2"><h2 id="hour">--</h2><small>Hrs</small></div>
                <div class="col-3 px-2"><h2 id="minute">--</h2><small>Min</small></div>
                <div class="col-3 px-2"><h2 id="second">--</h2><small>Sec</small></div>
              </div>
            </div>
            <div class="message-card p-4 text-start" data-aos="fade-up">
              <h3 class="font-esthetic">${escapeHtml(INVITATION.message.heading)}</h3>
              <p class="mb-3" style="line-height:1.85">${escapeHtml(INVITATION.message.body)}</p>
              <div class="font-esthetic fs-3 text-center">${escapeHtml(INVITATION.message.signOff)}</div>
            </div>
          </div>
        </section>
      `;
    }

    function renderGallery() {
      if (!INVITATION.sections.gallery || !INVITATION.gallery.length) return '';
      const id = 'gallery-carousel';
      return `
        <section id="gallery" class="section-pad bg-theme">
          <div class="container" style="max-width:960px">
            <div class="gallery-shell">
              <h2 class="section-title text-center mb-4">${escapeHtml(INVITATION.galleryTitle)}</h2>
              <div id="${id}" class="carousel slide" data-bs-ride="carousel">
                ${INVITATION.gallery.length > 1 ? `<div class="carousel-indicators">${INVITATION.gallery.map((_,i) => `<button type="button" data-bs-target="#${id}" data-bs-slide-to="${i}" class="${i===0?'active':''}" aria-label="Slide ${i+1}"></button>`).join('')}</div>` : ''}
                <div class="carousel-inner rounded-4">
                  ${INVITATION.gallery.map((img, i) => `
                    <div class="carousel-item ${i===0?'active':''}">
                      <img class="gallery-img d-block" src="${escapeHtml(img.src)}" alt="${escapeHtml(img.alt || '')}">
                    </div>
                  `).join('')}
                </div>
                ${INVITATION.gallery.length > 1 ? `
                  <button class="carousel-control-prev" type="button" data-bs-target="#${id}" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                  <button class="carousel-control-next" type="button" data-bs-target="#${id}" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
                ` : ''}
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderWishes() {
      if (!INVITATION.sections.wishes) return '';
      const w = INVITATION.wishes;
      const url = `https://wa.me/${encodeURIComponent(w.phone)}?text=${encodeURIComponent(w.prefilledMessage)}`;
      return `
        <section id="wishes" class="section-pad bg-surface text-center">
          <div class="container" style="max-width:560px">
            <h2 class="section-title">${escapeHtml(w.title)}</h2>
            <p class="text-muted-custom mb-4">${escapeHtml(w.description)}</p>
            <a class="whatsapp-btn" href="${url}" target="_blank" rel="noopener">
              <i class="fa-brands fa-whatsapp"></i>${escapeHtml(w.buttonText)}
            </a>
            <p class="text-muted-custom mt-3 small">${escapeHtml(w.hint)}</p>
          </div>
        </section>
      `;
    }

    function renderFooter() {
      if (!INVITATION.sections.footer) return '';
      return `
        <footer class="section-pad pt-2 pb-5 bg-surface text-center footer">
          <div class="container" style="max-width:720px">
            <p>${escapeHtml(INVITATION.footer.line1)}</p>
            <h3 class="font-esthetic fs-2 text-light-emphasis">${escapeHtml(INVITATION.footer.line2)}</h3>
            <p class="pt-2">${escapeHtml(INVITATION.footer.line3)}</p>
          </div>
        </footer>
      `;
    }

    function renderPage() {
      document.title = INVITATION.pageTitle;
      const heroCalendar = `<a class="calendar-btn mt-3" href="${googleCalendarUrl()}" target="_blank" rel="noopener"><i class="fa-solid fa-calendar-check"></i> Save The Date</a>`;
      $('#page-content').innerHTML = `
        <section id="home-section" class="hero">
          <img class="hero-bg" src="${escapeHtml(INVITATION.images.hero)}" alt="">
          <div class="hero-content text-center">
            <div class="hero-title font-esthetic mb-3">${escapeHtml(INVITATION.heroTitle)}</div>
            <img src="${escapeHtml(INVITATION.images.splash)}" alt="${escapeHtml(INVITATION.names)}" class="person-photo mb-4" style="width:190px;height:190px">
            <div class="hero-names mb-3">${escapeHtml(INVITATION.names)}</div>
            <div class="hero-date">${escapeHtml(INVITATION.date.display)}</div>
            ${heroCalendar}
            <div class="mt-5 text-muted-custom"><i class="fa-solid fa-chevron-down"></i><div class="small mt-2">${escapeHtml(INVITATION.scrollText)}</div></div>
          </div>
        </section>

        ${renderPeople()}
        ${renderSchedule()}
        ${renderCountdown()}
        ${renderGallery()}
        ${renderWishes()}
        ${renderFooter()}
      `;
    }

    let countdownStarted = false;
    function startCountdown() {
      if (countdownStarted || !INVITATION.sections.countdown) return;
      countdownStarted = true;
      const target = new Date(INVITATION.date.isoStart).getTime();
      const tick = () => {
        const diff = target - Date.now();
        const values = diff <= 0
          ? [0,0,0,0]
          : [Math.floor(diff/86400000), Math.floor(diff%86400000/3600000), Math.floor(diff%3600000/60000), Math.floor(diff%60000/1000)];
        ['day','hour','minute','second'].forEach((id, i) => {
          const el = document.getElementById(id);
          if (el) el.textContent = String(values[i]).padStart(2,'0');
        });
      };
      tick();
      setInterval(tick, 1000);
    }

    let isPlaying = false;
    function initMusic() {
      const music = $('#bg-music');
      const btn = $('#music-btn');
      if (!INVITATION.music.enabled || !INVITATION.music.src) return;
      music.src = INVITATION.music.src;
      music.volume = Math.min(1, Math.max(0, Number(INVITATION.music.volume) || 0.4));
      btn.style.display = 'flex';
      btn.addEventListener('click', async () => {
        if (isPlaying) {
          music.pause();
          isPlaying = false;
          btn.classList.remove('playing');
          $('#music-icon').className = 'fa-solid fa-music';
          return;
        }
        try { await music.play(); } catch (_) {}
        isPlaying = !music.paused;
        btn.classList.toggle('playing', isPlaying);
        $('#music-icon').className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-music';
      });
    }

    function initThemeToggle() {
      const btn = $('#theme-btn');
      if (!INVITATION.effects.themeToggle) return;
      btn.style.display = 'flex';
      btn.addEventListener('click', () => {
        document.body.classList.toggle('appearance-light');
      });
    }

    function burstConfetti() {
      if (!INVITATION.effects.confetti || typeof confetti !== 'function') return;
      const c = [getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(), getComputedStyle(document.documentElement).getPropertyValue('--accent-2').trim(), '#ffffff'];
      confetti({ particleCount: 120, spread: 85, origin: {x:.5,y:.5}, colors: c, scalar:1.1, startVelocity:42, gravity:.8 });
      setTimeout(() => confetti({ particleCount: 60, angle:60, spread:55, origin:{x:0,y:.65}, colors:c }), 120);
      setTimeout(() => confetti({ particleCount: 60, angle:120, spread:55, origin:{x:1,y:.65}, colors:c }), 240);
    }

    function openInvitation() {
      burstConfetti();
      const splash = $('#splash');
      const invite = $('#invitation');
      splash.classList.add('hide');
      setTimeout(() => {
        splash.style.display = 'none';
        invite.style.display = 'block';
        requestAnimationFrame(() => invite.classList.add('show'));
        $('#music-btn').style.display = INVITATION.music.enabled && INVITATION.music.src ? 'flex' : 'none';
        startCountdown();
        if (window.AOS) AOS.refresh();
        setTimeout(burstConfetti, 500);

        const music = $('#bg-music');
        if (INVITATION.music.enabled && INVITATION.music.src) {
          music.play().then(() => {
            isPlaying = true;
            $('#music-btn').classList.add('playing');
            $('#music-icon').className = 'fa-solid fa-pause';
          }).catch(() => {});
        }
      }, 760);
    }

    function initScrollNav() {
      const links = [...document.querySelectorAll('#nav-items .nav-link')];
      const sections = links.map(a => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
      const observer = new IntersectionObserver(entries => {
        const visible = entries.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible) return;
        links.forEach(link => link.classList.toggle('active', link.getAttribute('href') === '#' + visible.target.id));
      }, { rootMargin: '-35% 0px -55% 0px', threshold: [0, .25, .5, .75, 1] });
      sections.forEach(section => observer.observe(section));
    }

    function boot() {
      applyTheme();
      renderSplash();
      renderNav();
      renderPage();
      initMusic();
      initThemeToggle();
      if (window.AOS) AOS.init({ duration: 650, easing: 'ease', once: true });
      $('#open-invitation').addEventListener('click', openInvitation);
      initScrollNav();
    }

    boot();
  </script>
</body>
</html>
